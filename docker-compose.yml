# Local stack: PostgreSQL, Redis, migrations, the API (and an optional seed).
#   docker compose up --build -d
#   docker compose run --rm seed
# Runs in development mode (Swagger at /docs, sandbox deposit simulation).
x-api-env: &api-env
  NODE_ENV: development
  DATABASE_URL: postgresql://irate:irate@postgres:5432/irate?schema=public
  REDIS_URL: redis://redis:6379/0
  PUBLIC_API_URL: http://localhost:8000
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:9000

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: irate
      POSTGRES_PASSWORD: irate
      POSTGRES_DB: irate
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irate -d irate"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: runtime }
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  seed:
    build: { context: ., target: runtime }
    environment: *api-env
    command: ["node", "dist/scripts/seed.js"]
    profiles: [tools]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
